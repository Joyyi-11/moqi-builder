name: 问题反馈
description: 结构校验失败、模板占位符残留、适配器加载异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先确认这不是「不符合适用边界」的问题（见 README 的「适用边界」一节）。
        与模板结构、模式划分相关的调整建议请用「建议」模板，不要用本模板。
  - type: dropdown
    id: mode
    attributes:
      label: 相关模式
      options:
        - build
        - update
        - diagnose
        - align
        - 不确定
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 使用的 agent 平台与版本
      placeholder: 例如 Claude Code 2.x / WorkBuddy / Codex
    validations:
      required: true
  - type: textarea
    id: structure
    attributes:
      label: 你的实例目录结构
      description: 列出 entrypoints/、MSA/、references/、ALIGNMENT.md 的实际状态
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: false
  - type: textarea
    id: verify
    attributes:
      label: 结构校验脚本输出
      description: python scripts/verify_system.py <实例根目录> 的完整输出
      render: text
    validations:
      required: false
